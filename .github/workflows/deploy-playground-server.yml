name: Deploy playground server

on:
  push:
    branches: [main]
    # The image bakes the whole repo (Dockerfile does `COPY . /gsx`) because the
    # playground compiles visitor code against the live gsx module. So a parser or
    # codegen change does need a redeploy — only paths that cannot reach the
    # running compiler belong here.
    paths-ignore:
      - 'docs/**'
      - 'skills/**'
      - '**.md'
      - 'LICENSE'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-server-deploy
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.1'
  PLAYGROUND_URL: https://gsx-playground.fly.dev

jobs:
  deploy:
    name: build, deploy, smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify playground server
        run: make ci-playground

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      # Built on this runner (--local-only) and pushed to registry.fly.io, so no
      # remote builder machine is spun up in the org. --ha=false keeps the app at
      # one machine. FLY_API_TOKEN is a deploy token scoped to the gsx-playground
      # app (see playground/server/deploy.md).
      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy -c playground/server/fly.toml --local-only --ha=false .

      - name: Smoke test deployed renderer
        run: |
          cat > /tmp/spread-attrs.json <<'JSON'
          {
            "gsx": "package views\n\nimport \"github.com/gsxhq/gsx\"\n\ncomponent Card(extra gsx.Attrs) {\n\t<div { extra... }>content</div>\n}\n",
            "invoke": "Card(gsx.Attrs{{Key: \"id\", Value: \"box\"}, {Key: \"data-active\", Value: \"true\"}})"
          }
          JSON

          python3 - "$PLAYGROUND_URL" <<'PY'
          import json
          import sys
          import urllib.request

          url = sys.argv[1].rstrip("/") + "/render"
          with open("/tmp/spread-attrs.json", "rb") as f:
              body = f.read()
          req = urllib.request.Request(
              url,
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              data = json.loads(resp.read().decode("utf-8"))
          expected = '<div id="box" data-active="true">content</div>'
          if data.get("error") or data.get("html") != expected:
              print(json.dumps(data, indent=2), file=sys.stderr)
              raise SystemExit("spread-attrs smoke test failed")
          print(f"smoke ok: {data['html']}")
          PY
